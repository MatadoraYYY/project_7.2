version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:///./data/promo_engine.db
      ALLOWED_ORIGINS: http://localhost:8000
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in your environment or .env file}
    volumes:
      - promo_data:/app/data
    restart: unless-stopped
volumes:
  promo_data:

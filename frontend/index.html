<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Персональные промо-предложения — Дашборд</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>Персональные промо-предложения</h1>
  <p class="subtitle">Дашборд системы динамических офферов</p>
</header>
<main class="container">
  <section class="kpi-grid" id="kpi-grid" aria-label="Ключевые показатели"></section>

  <section class="panel">
    <h2>Клиенты</h2>
    <div class="table-wrapper">
      <table id="customers-table">
        <thead><tr><th>ID</th><th>Внешний ID</th><th>Заказы</th><th>LTV</th><th>Эластичность</th><th>Сегмент</th><th>Действие</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="offers-panel" hidden>
    <h2>Персональные офферы для клиента <span id="selected-customer-label"></span></h2>
    <div class="offers-grid" id="offers-grid"></div>
  </section>

  <section class="panel">
    <h2>A/B-тест: персональные vs массовые промо</h2>
    <div class="table-wrapper">
      <table id="ab-test-table">
        <thead><tr><th>Группа</th><th>Клиенты</th><th>Офферы</th><th>Конверсии</th><th>Конверсия, %</th><th>Средний чек</th><th>Маржа, %</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="ab-test-note" class="note"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
